# WARNING: Insecure default credentials below. For local development only — do not use in production.
services:
  proof-server:
    # Pinned to a release, not `:latest`, so the stack matches the
    # ledger-v8 versions in "Supported stack" (packages/deployer/README.md)
    # and does not move under the suite.
    image: 'midnightntwrk/proof-server:8.0.3'
    command: ['midnight-proof-server -v']
    ports:
      - '6300:6300'
    environment:
      RUST_BACKTRACE: 'full'
    # The image ships no curl, so `make env-up` polls /version from the host.
    healthcheck:
      disable: true

  indexer:
    # Pinned for the same reason as proof-server above.
    image: 'midnightntwrk/indexer-standalone:4.0.1'
    ports:
      - '8088:8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,info'
      APP__INFRA__NODE__URL: 'ws://node:9944'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
      APP__INFRA__STORAGE__PASSWORD: 'indexer'
      APP__INFRA__PUB_SUB__PASSWORD: 'indexer'
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: 'indexer'
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy
    logging:
      driver: local
      options:
        max-size: '10m'
        max-file: '3'

  node:
    image: 'midnightntwrk/midnight-node:0.22.2'
    ports:
      - '9944:9944'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9944/health']
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
    logging:
      driver: local
      options:
        max-size: '10m'
        max-file: '3'
