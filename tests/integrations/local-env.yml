# WARNING: Insecure default credentials below. For local development only — do not use in production.
services:
  proof-server:
    # Pinned to a release, not `:latest`, so the stack matches the
    # ledger-v9 versions in "Supported stack" (packages/deployer/README.md)
    # and does not move under the suite.
    image: 'midnightntwrk/proof-server:9.0.0-rc.6'
    command: ['midnight-proof-server -v']
    ports:
      - '127.0.0.1:6300:6300'
    environment:
      RUST_BACKTRACE: 'full'
    # The image ships no curl, so `make env-up` polls /version from the host.
    healthcheck:
      disable: true

  indexer:
    # Pinned for the same reason as proof-server above. This is the ledger-9
    # line matching node 2.0.0-rc.4; `latest` drifted to the Cardano-bridge
    # indexer, which crash-loops without a Blockfrost id.
    image: 'midnightntwrk/indexer-standalone:4.4.0-rc.2'
    ports:
      - '127.0.0.1:8088:8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,info'
      APP__INFRA__NODE__URL: 'ws://node:9944'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
      APP__INFRA__STORAGE__PASSWORD: 'indexer'
      APP__INFRA__PUB_SUB__PASSWORD: 'indexer'
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: 'indexer'
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
      # The spo-indexer subprocess dials spo_node.url, which defaults to
      # ws://localhost:9944 (nothing inside the container) and takes the whole
      # process down. Point it at the node; blockfrost_id only has to be
      # non-empty while SPO features are unused.
      APP__INFRA__SPO_NODE__URL: 'ws://node:9944'
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: 'unused-local-devnet'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy
    logging:
      driver: local
      options:
        max-size: '10m'
        max-file: '3'

  node:
    image: 'midnightntwrk/midnight-node:2.0.0-rc.4'
    ports:
      - '127.0.0.1:9944:9944'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9944/health']
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
    logging:
      driver: local
      options:
        max-size: '10m'
        max-file: '3'
