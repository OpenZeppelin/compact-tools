# contracts/compact-mock.toml in OpenZeppelin compact-contracts: the five mocks it
# generates, with the authenticator its modules take a caller from.
src = "src"
spdx = "MIT"

[auth]
module = "crypto/authentication/AuthPrfPseudonym"
call = 'authenticate(pad(32, "{salt}"))'
caller_type = { name = "Caller", module = "identifier/Identifier" }

# MockOwnable (isInit) and MockOwnableCaller (plain). Ownable.test.ts pins an empty
# public ledger, so neither exports the module's ledger fields.
[[mock]]
module = "access/Ownable"
ledger = false
auth.init = { flag = "isInit" }

# MockZOwnablePK: no caller parameter, so one mock.
[[mock]]
module = "access/ZOwnablePK"
init = { flag = "isInit" }

[[mock]]
module = "multisig/Secp256k1EcdsaMultisig"
name = "MockSecp256k1EcdsaMultisig1To3"
module_args = ["1"]
circuit_args = { initialize = ["3"] }

# The authenticated mock only; the *Caller mock stays hand-written.
[[mock]]
module = "token/ConfidentialFungibleToken"
prefix = "CFT_"
variants = ["auth"]
