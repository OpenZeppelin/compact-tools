[package]
name = "compact-mock"
version = "0.1.0"
description = "Mock contract generator for Compact modules"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Released as a binary on the GitHub release and through npm.
publish = false

[lints]
workspace = true

[lib]
name = "compact_mock"
path = "src/lib.rs"

[[bin]]
name = "compact-mock"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde.workspace = true
similar.workspace = true
thiserror.workspace = true
toml.workspace = true
tree-sitter.workspace = true
compact-tree-sitter.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
tempfile.workspace = true
