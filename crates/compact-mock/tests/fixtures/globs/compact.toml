[mock]
caller_type = { name = "Badge", module = "who/Who" }
exclude = ["auth/*"]

[mock.auth.gate]
module = "auth/Gate"
call = 'authenticate(pad(32, "{salt}"))'

[[mock.rules]]
modules = ["**"]
guard = true

[[mock.rules]]
modules = ["access/*"]
auth = ["gate", "caller"]
guard = ["open"]
caller.guard = false

[[mock.rules]]
modules = ["**"]
exclude_modules = ["access/**"]
disclose = ["twice"]
