# The deployer and the linter ignore [mock]; the rule reads it through compact-mock.
[lint]
include = ["src/**/*.compact"]
exclude = ["**/test/**"]

[lint.rules]
missing-doc = "off"
missing-tag = "off"
unknown-section = "off"
tag-order = "off"
forbidden-tag = "off"
module-name = "off"
doc-placeholder = "off"
missing-constraints = "off"
constraints-format = "off"
constraints-placeholder = "off"
constraints-unmeasured = "off"
constraints-unmeasurable = "off"

[mock]
exclude = ["c/*"]

[[mock.rules]]
modules = ["a/*", "c/*", "d/*", "f/*", "g/*", "p/*"]

[[mock.rules]]
modules = ["a/Partial"]
exclude = ["close"]

[[mock.rules]]
modules = ["f/Framed"]
init = "none"
exclude = ["initialize"]
