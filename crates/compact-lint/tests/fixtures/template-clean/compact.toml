# The kind tables of examples/compact.toml, with the include glob pointed at the case.
[lint]
include = ["**/*.compact"]

[lint.constraints]
tag = "@constraints"

[lint.tags]
forbid = ["@return"]
rename = { "@return" = "@returns" }

[lint.kinds.module]
docs = "all"
tags = [
  "@module",
  "@description",
  "@notice Privacy",
  "@notice Security",
  "@notice Concurrency",
  "@notice Scope",
  "@dev Performance",
]
sections = [
  "@module",
  "@description",
  "@dev Notation",
  "@dev Derivations",
  "@dev Parameterization",
  "@dev Compatibility",
  "@notice Privacy",
  "@notice Security",
  "@notice Concurrency",
  "@notice Scope",
  "@notice Client-side duties",
  "@notice Scalability",
  "@dev Performance",
  "@dev Composition",
]

[lint.kinds.circuit]
tags = ["@description"]

[lint.kinds.ledger]
tags = ["@description"]

[lint.kinds.witness]
docs = "all"
tags = ["@description"]

[lint.kinds.struct]
tags = ["@description"]

[lint.kinds.enum]
tags = ["@description"]

[lint.kinds.constructor]
docs = "none"
