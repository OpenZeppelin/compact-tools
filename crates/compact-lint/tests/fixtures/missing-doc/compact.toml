[lint]
include = ["**/*.compact"]

[lint.tags]
forbid = ["@return"]

[lint.kinds.module]
tags = ["@module", "@description"]

[lint.kinds.circuit]
tags = ["@description"]

[lint.kinds.ledger]
tags = ["@description"]

[lint.kinds.witness]
docs = "all"
tags = ["@description"]

[lint.kinds.struct]
tags = ["@description"]

[lint.kinds.enum]
tags = ["@description"]

[lint.kinds.constructor]
docs = "none"
