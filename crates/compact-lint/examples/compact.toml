# compact-lint config for OpenZeppelin/compact-contracts.
# Copy it to the repository root as compact.toml.
#
# One project, one config file. compact-deploy's `[profile]`, `[networks.*]`,
# `[wallet]` and `[contracts.*]` tables live in this same file and the linter
# ignores them; see examples/fungible-token/compact.toml for their shape.

[lint]
include = ["contracts/src/**/*.compact"]
exclude = ["**/test/mocks/**", "**/archive/**"]

# `@constraints` is the default; set `tag` to point the rule at another annotation.
[lint.constraints]
tag = "@constraints"
# Presets are contracts, so fill-constraints compiles them directly. Everything else is
# measured through the mock beside it or in its parent, the default `sources` templates.
self = ["**/presets/**"]

[lint.tags]
forbid = ["@return"]
rename = { "@return" = "@returns" }

# Every rule's default level, spelled out. Set one to "off" to stop it running, or to
# "warn" / "info" to keep it out of the exit code. `check --strict` promotes
# constraints-placeholder to "error" for that run.
# [lint.rules]
# missing-doc = "error"
# missing-tag = "error"
# forbidden-tag = "error"
# module-name = "error"
# missing-constraints = "error"
# constraints-format = "error"
# constraints-placeholder = "warn"
# constraints-unmeasured = "warn"
# constraints-unmeasurable = "warn"
# parse = "error"
# format = "error"

[lint.kinds.module]
docs = "exported"
tags = ["@module", "@description"]

[lint.kinds.circuit]
tags = ["@description"]

[lint.kinds.ledger]
tags = ["@description"]

[lint.kinds.witness]
docs = "all"
tags = ["@description"]

[lint.kinds.struct]
tags = ["@description"]

[lint.kinds.enum]
tags = ["@description"]

[lint.kinds.constructor]
docs = "none"

[lint.kinds.contract]

[lint.kinds.type]
