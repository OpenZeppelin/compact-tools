[balancing]
source = "Measured 2026-11-20 on a local dev chain on node 2.1.101 as balanced minus proven for a single base mint and a single preset mint; the wallet adds one intent holding one dust spend. Ranges across runs: nodes +8 to +10, bytes +3,264 to +3,283, blockUsage +3,264 to +3,278; readTime, computeTime, bytesWritten, bytesChurned and time to dismiss were constant. The values are the conservative end. Balancing also grows every intent's binding commitment from 32 or 33 bytes to 96 or 97, so further_intent_bytes counts each intent after the first: on merges of 2, 29, 30, 39, 40 and 41 one-call intents, blockUsage grew by 3,340 to 5,860, which is 57 to 64.7 bytes per further intent above the one-intent 3,283. Nodes, the other cost dimensions and time to dismiss did not change with the intent count. 65 is the conservative end"
nodes = 10
bytes = 3_283
further_intent_bytes = 65
cost = { readTime = "1870000000", computeTime = "3433722316", blockUsage = "3283", bytesWritten = "224", bytesChurned = "9288" }

[proof]
source = "Measured 2026-11-20 on a local dev chain on node 2.1.101 by decoding proven transactions next to the unproven builds they were proved from: two mint circuits, single calls and merges of 2 to 41 calls, one Zswap output per call. Every contract call proof (ProofVersioned::V3, 5,392 bytes) serialized to 5,395 bytes against the 4,832 the ledger's estimate assumes, +563. Every Zswap output proof serialized to 4,834 against 4,832 and every Dust spend proof to 2,914 against 2,912, +2 for the length prefix. The rest of the transaction grew by up to 1 byte per call, which call_bytes includes. Proven minus estimated size was 565.9 to 566 bytes per call, and 576 on single calls of one circuit, whose proving also added a 10-byte transcript noop this term does not cover. Zswap input and transient proofs were not captured; they share the output proof's encoding, so they are assumed to add the same 2 bytes"
call_bytes = 564
builtin_bytes = 2

