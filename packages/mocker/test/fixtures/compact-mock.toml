# The mocks mocks.test.ts compiles and simulates. Regenerate them with
# `compact-mock generate --config test/fixtures/compact-mock.toml`.
spdx = "MIT"

[auth]
module = "auth/Pseudonym"
call = 'authenticate(pad(32, "{salt}"))'
caller_type = { name = "Caller", module = "identity/Id" }

# MockOwned injects the caller and takes an isInit flag. MockOwnedCaller takes
# the caller as an argument and exports no ledger field.
[[mock]]
module = "access/Owned"
exclude = ["_setOwner"]
auth.init = { flag = "isInit" }
caller.ledger = false

# No caller parameter, so one mock. authenticate returns witness data.
[[mock]]
module = "auth/Pseudonym"
disclose = ["authenticate"]

[[mock]]
module = "crypto/Hash"
disclose = ["mix"]
guard = ["square"]
rename = { double = "twice" }
include = true

[[mock]]
module = "generic/Bag"
module_args = ["4"]
circuit_args = { initialize = ["2"], put = ["Field"], first = ["3"] }

# init = "none" on a module with initialize: no constructor, initialize stays a circuit.
[[mock]]
module = "generic/Bag"
name = "MockBagNoInit"
module_args = ["4"]
init = "none"
circuit_args = { initialize = ["2"], put = ["Field"], first = ["3"] }
