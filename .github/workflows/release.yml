name: Release Package

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Which package to release"
        required: true
        type: choice
        options:
          - compact-builder
          - compact-cli
          - compact-deployer
          - compact-launcher
          - compact-linter
          - compact-mocker
          - compact-profiler
          - compact-simulator
      version_bump:
        description: "Version bump type (pre* strategies are beta-only)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
          - prepatch
          - preminor
          - premajor

jobs:
  release:
    name: Open release PR for ${{ inputs.package }}
    runs-on: ubuntu-24.04

    permissions:
      contents: write       # create the release branch
      pull-requests: write  # open the PR + enable auto-merge

    steps:
      # Prerelease versions carry the `beta` npm dist-tag and stable versions
      # carry `latest`. Pinning each strategy to its branch keeps a beta out of
      # main's history and a stable out of beta's.
      - name: Validate bump strategy for this branch
        env:
          BRANCH: ${{ github.ref_name }}
          BUMP: ${{ inputs.version_bump }}
        run: |
          case "$BUMP" in
            prerelease|prepatch|preminor|premajor)
              if [[ "$BRANCH" != "beta" ]]; then
                echo "::error::$BUMP is beta-only, but this run is on '$BRANCH'"
                exit 1
              fi
              ;;
            patch|minor|major)
              if [[ "$BRANCH" != "main" ]]; then
                echo "::error::$BUMP is main-only, but this run is on '$BRANCH'"
                exit 1
              fi
              ;;
            *)
              echo "::error::unknown bump strategy: $BUMP"
              exit 1
              ;;
          esac

      - name: Get github app token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: gh-app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      # Cargo build scripts and the package tests run in this job, so the checkout
      # keeps no credential. The commit action's local pull runs unauthenticated.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.gh-app-token.outputs.token }}
          persist-credentials: false

      # One row per package. A Rust-binary package also names its crate
      # directory, Cargo package and binary (the release asset prefix). Keep the
      # table in step with release-publish.yml.
      - name: Set package directory
        id: pkg
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          # npm name         dir        crate dir               Cargo package    binary
          PACKAGES='
          compact-builder    builder
          compact-cli        cli
          compact-deployer   deployer
          compact-launcher   launcher
          compact-linter     linter     crates/compact-lint     compact-lint     compact-lint
          compact-mocker     mocker     crates/compact-mock     compact-mock     compact-mock
          compact-profiler   profiler   crates/compact-profile  compact-profile  compact-profile
          compact-simulator  simulator
          '
          ROW=$(awk -v key="$INPUT_PACKAGE" '$1 == key' <<< "$PACKAGES")
          if [[ -z "$ROW" ]]; then
            echo "::error::unknown package: $INPUT_PACKAGE"
            exit 1
          fi
          read -r _ DIR CRATE_DIR CARGO_PACKAGE _ <<< "$ROW"
          {
            echo "dir=$DIR"
            echo "crate_dir=$CRATE_DIR"
            echo "cargo_package=$CARGO_PACKAGE"
          } >> $GITHUB_OUTPUT

      - name: Setup Environment
        uses: ./.github/actions/setup

      # A Rust-binary package's version lives in its crate too, and bumping it
      # there rewrites Cargo.lock.
      - name: Install the pinned toolchain
        if: steps.pkg.outputs.crate_dir != ''
        run: |
          CHANNEL=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)
          rustup toolchain install "$CHANNEL" --profile minimal
          rustup show active-toolchain

      # The profiler's and the mocker's end-to-end tests run their crate's
      # target/release binary and fail under CI without it.
      - name: Build the crate's release binary
        if: steps.pkg.outputs.crate_dir != ''
        env:
          CARGO_PACKAGE: ${{ steps.pkg.outputs.cargo_package }}
        run: cargo build --release -p "$CARGO_PACKAGE"

      - name: Run tests for package
        run: yarn test --filter=@openzeppelin/${{ inputs.package }}

      - name: Build package
        run: yarn build --filter=@openzeppelin/${{ inputs.package }}

      - name: Bump version
        id: version
        run: |
          cd packages/${{ steps.pkg.outputs.dir }}
          yarn version ${{ inputs.version_bump }}
          NEW_VERSION=$(node -p "require('./package.json').version")
          # Yarn has no --preid, so a pre* strategy off a stable version yields a
          # bare counter (0.3.1 -> 0.3.2-0). Relabel it once; from there yarn
          # carries the identifier forward (0.3.2-beta.0 -> 0.3.2-beta.1).
          if [[ "$NEW_VERSION" =~ -[0-9]+$ ]]; then
            yarn version "${NEW_VERSION%-*}-beta.0"
            NEW_VERSION=$(node -p "require('./package.json').version")
          fi
          if [[ "$NEW_VERSION" == *-beta.* ]]; then
            DIST_TAG=beta
          else
            DIST_TAG=latest
          fi
          {
            echo "new=$NEW_VERSION"
            echo "branch=release/${{ inputs.package }}-v$NEW_VERSION"
            echo "dist_tag=$DIST_TAG"
          } >> $GITHUB_OUTPUT
          {
            echo "### Release Summary"
            echo "- Package: ${{ inputs.package }}"
            echo "- New version: $NEW_VERSION"
            echo "- Bump type: ${{ inputs.version_bump }}"
            echo "- npm dist-tag: $DIST_TAG"
          } >> $GITHUB_STEP_SUMMARY

      - name: Sync the crate version
        if: steps.pkg.outputs.crate_dir != ''
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
          CRATE_DIR: ${{ steps.pkg.outputs.crate_dir }}
          CRATE_PACKAGE: ${{ steps.pkg.outputs.cargo_package }}
        run: |
          sed -i "0,/^version = .*/s//version = \"$NEW_VERSION\"/" "$CRATE_DIR/Cargo.toml"
          # Resolving the workspace rewrites the crate's own Cargo.lock entry.
          cargo metadata --format-version 1 > /tmp/cargo-metadata.json
          ACTUAL=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/cargo-metadata.json','utf8')).packages.find((p) => p.name === '$CRATE_PACKAGE').version")
          if [[ "$ACTUAL" != "$NEW_VERSION" ]]; then
            echo "::error::$CRATE_DIR/Cargo.toml is at $ACTUAL, expected $NEW_VERSION"
            exit 1
          fi

      - name: Verify package contents
        run: |
          cd packages/${{ steps.pkg.outputs.dir }}
          yarn pack --dry-run

      # Branch protection blocks direct pushes to main, so route the version bump
      # through a PR: create branch → signed bot commit → open PR → auto-merge.
      - name: Create release branch
        env:
          GH_TOKEN: ${{ steps.gh-app-token.outputs.token }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          if gh api "/repos/${{ github.repository }}/git/refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "branch $BRANCH already exists, reusing it"
          else
            SHA=$(gh api "/repos/${{ github.repository }}/git/refs/heads/${{ github.ref_name }}" -q .object.sha)
            gh api --method POST "/repos/${{ github.repository }}/git/refs" \
              -f ref="refs/heads/$BRANCH" \
              -f sha="$SHA"
          fi

      - name: Commit version bump
        if: steps.pkg.outputs.crate_dir == ''
        uses: iarekylew00t/verified-bot-commit@42a042b0407248f3c0acac00c389e729e3476e86 # v2.3.5
        with:
          message: "release: ${{ inputs.package }} v${{ steps.version.outputs.new }}"
          token: ${{ steps.gh-app-token.outputs.token }}
          ref: ${{ steps.version.outputs.branch }}
          files: |
            packages/${{ steps.pkg.outputs.dir }}/package.json

      - name: Commit version bump with the crate
        if: steps.pkg.outputs.crate_dir != ''
        uses: iarekylew00t/verified-bot-commit@42a042b0407248f3c0acac00c389e729e3476e86 # v2.3.5
        with:
          message: "release: ${{ inputs.package }} v${{ steps.version.outputs.new }}"
          token: ${{ steps.gh-app-token.outputs.token }}
          ref: ${{ steps.version.outputs.branch }}
          files: |
            packages/${{ steps.pkg.outputs.dir }}/package.json
            ${{ steps.pkg.outputs.crate_dir }}/Cargo.toml
            Cargo.lock

      - name: Ensure release label exists
        env:
          GH_TOKEN: ${{ steps.gh-app-token.outputs.token }}
        run: |
          gh label create release \
            --description "Automated release PR" \
            --color ededed \
            --force

      - name: Open release PR
        id: open-pr
        env:
          GH_TOKEN: ${{ steps.gh-app-token.outputs.token }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          cat > /tmp/pr-body.md <<EOF
          Automated release PR for **${{ inputs.package }}** v${{ steps.version.outputs.new }} (${{ inputs.version_bump }} bump).

          Publishes to npm under the \`${{ steps.version.outputs.dist_tag }}\` dist-tag.

          This PR was opened by the release workflow. Once required checks pass (semgrep, CodeQL, code-owner review), it will auto-merge. Merging will trigger the publish workflow, which tags the release and publishes to npm.
          EOF
          PR_URL=$(gh pr create \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH" \
            --title "release: ${{ inputs.package }} v${{ steps.version.outputs.new }}" \
            --label release \
            --body-file /tmp/pr-body.md)
          echo "url=$PR_URL" >> $GITHUB_OUTPUT
          echo "- PR: $PR_URL" >> $GITHUB_STEP_SUMMARY

      # If this step fails with "auto-merge is not allowed", enable it under
      # Settings → General → "Allow auto-merge", then re-run the workflow.
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.gh-app-token.outputs.token }}
        run: gh pr merge "${{ steps.open-pr.outputs.url }}" --auto --squash
