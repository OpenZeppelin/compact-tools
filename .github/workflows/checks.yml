name: Format and Lint

on:
  pull_request:
  push:
    branches:
      - main
      - beta

jobs:
  checks:
    name: Run Checks
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # Recommended by turbo team

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Format & Lint
        run: yarn lint:ci

      - name: Run type checks
        run: yarn types

      # The profiler's end-to-end tests fail under CI without this binary.
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install 1.96 --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain

      - name: Build compact-profile
        run: cargo build -p compact-profile

      - name: Run tests
        run: yarn test
        env:
          COMPACT_PROFILE_BINARY: ${{ github.workspace }}/target/debug/compact-profile
