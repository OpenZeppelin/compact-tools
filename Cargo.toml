[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/OpenZeppelin/compact-tools"
rust-version = "1.96"

# Release binaries ship as GitHub release assets, so size and speed both matter.
# Unwinding stays on: the error paths depend on it.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
anstyle = "1.0"
anyhow = "1.0"
cc = "1"
clap = { version = "4.6", features = ["derive", "env"] }
globset = "0.4"
hex = "0.4"
# The ledger crates are pinned exactly: the cost model is versioned with them.
midnight-base-crypto = "=1.1.1"
midnight-ledger-v9 = "=1.0.1"
midnight-serialize = "=1.2.1"
midnight-storage = "=3.0.0"
# Not imported: enables the storage features midnight-node builds the ledger with.
midnight-storage-core = { version = "=1.2.3", features = ["layout-v2", "gc-v1"] }
midnight-transient-crypto = "=3.0.1"
portable-pty = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "2.7"
thiserror = "2.0"
toml = "1.1"
tree-sitter = "0.25"
compact-tree-sitter = { version = "0.1.0", path = "crates/compact-tree-sitter" }
compact-mock = { version = "0.1.0", path = "crates/compact-mock" }
tree-sitter-language = "0.1"
tempfile = "3.27"
walkdir = "2.5"

assert_cmd = "2.2"
