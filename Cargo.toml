[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/OpenZeppelin/compact-tools"
rust-version = "1.96"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
anyhow = "1.0"
cc = "1"
clap = { version = "4.6", features = ["derive", "env"] }
globset = "0.4"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "1.1"
tree-sitter = "0.25"
compact-tree-sitter = { version = "0.1.0", path = "crates/compact-tree-sitter" }
tree-sitter-language = "0.1"
walkdir = "2.5"

assert_cmd = "2.2"
tempfile = "3.27"
